# Edge stack: Traefik, Portainer and log rotation. Deploy rarely, over SSH:
#   docker compose -p skydive-theorie-infra -f compose.infra.yml up -d --build
# Keep it out of Portainer-managed stacks so app redeploys never recreate the proxy.
services:
  traefik:
    # Built locally so portainer.yml is baked in; bind-mounting repo files breaks Portainer Git stacks.
    build:
      context: ./traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skydive-proxy
      - --providers.file.filename=/etc/traefik/portainer.yml
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --accesslog.format=json
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Referer=keep
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik-logs:/logs
    networks:
      - proxy

  portainer:
    image: portainer/portainer-ee:lts
    restart: unless-stopped
    command:
      - --base-url
      - /portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=skydive-proxy
      - traefik.http.routers.portainer.rule=Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`) && PathPrefix(`/portainer`)
      - traefik.http.routers.portainer.entrypoints=websecure
      - traefik.http.routers.portainer.tls=true
      - traefik.http.routers.portainer.priority=10000
      - traefik.http.routers.portainer.middlewares=portainer-stripprefix
      - traefik.http.middlewares.portainer-stripprefix.stripprefix.prefixes=/portainer
      - traefik.http.services.portainer.loadbalancer.server.port=9443
      - traefik.http.services.portainer.loadbalancer.server.scheme=https
      # The transport lives in traefik/portainer.yml (file provider), not Docker labels.
      - traefik.http.services.portainer.loadbalancer.serversTransport=portainer-insecure@file

  logrotate:
    build:
      context: ./logrotate
    restart: unless-stopped
    volumes:
      - traefik-logs:/logs

networks:
  proxy:
    name: skydive-proxy

volumes:
  letsencrypt:
    external: true
    name: skydive-theorie-prod_letsencrypt
  traefik-logs:
    external: true
    name: skydive-theorie-prod_traefik-logs
  portainer_data:
    external: true
