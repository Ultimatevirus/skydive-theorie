name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile.txt
          push: true
          tags: |
            ghcr.io/Ultimatevirus/skydive-theorie:latest
            ghcr.io/Ultimatevirus/skydive-theorie:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/skydive-theorie
            cd /opt/skydive-theorie

            cat > docker-compose.yml <<'EOF'
            services:
              skydive-theorie:
                image: ghcr.io/Ultimatevirus/skydive-theorie:latest
                container_name: skydive-theorie
                restart: unless-stopped
                ports:
                  - "5000:5000"
                environment:
                  FLASK_ENV: production
            EOF

            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
