name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -v

      - name: Validate Compose configuration
        env:
          APP_IMAGE: ghcr.io/ultimatevirus/skydive-theorie:${{ github.sha }}
          SECRET_KEY: ci-validation-secret
          TRAEFIK_HOST: theorie.example.com
          ACME_EMAIL: ci@example.com
        run: docker compose -f compose.yml -f compose.production.yml config

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/Ultimatevirus/skydive-theorie:${{ github.sha }}

      - name: Upload Compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "compose.yml,compose.production.yml"
          target: /opt/skydive-theorie

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: APP_IMAGE,SECRET_KEY,TRAEFIK_HOST,ACME_EMAIL
          script: |
            set -e
            mkdir -p /opt/skydive-theorie
            cd /opt/skydive-theorie

            umask 077
            cat > .env <<EOF
            APP_IMAGE=$APP_IMAGE
            SECRET_KEY=$SECRET_KEY
            TRAEFIK_HOST=$TRAEFIK_HOST
            ACME_EMAIL=$ACME_EMAIL
            TRAEFIK_HTTP_PORT=80
            TRAEFIK_HTTPS_PORT=443
            EOF

            docker compose -f compose.yml -f compose.production.yml config
            docker compose -f compose.yml -f compose.production.yml pull
            docker compose -f compose.yml -f compose.production.yml up -d --remove-orphans
            docker image prune -f
        env:
          APP_IMAGE: ghcr.io/ultimatevirus/skydive-theorie:${{ github.sha }}
          SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
          TRAEFIK_HOST: ${{ secrets.TRAEFIK_HOST }}
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
