services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:5000"
    expose:
      - "5000"
    volumes:
      - app-data:/data
    environment:
      APP_ENV: ${APP_ENV:-development}
      SECRET_KEY: ${SECRET_KEY:-local-development-only-change-me}
      ACCESS_GATE_ENABLED: ${ACCESS_GATE_ENABLED:-1}
      ACCESS_CODE: ${ACCESS_CODE:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      KNMI_API_KEY: ${KNMI_API_KEY:-}
      KNMI_OPEN_DATA_URL: ${KNMI_OPEN_DATA_URL:-https://api.dataplatform.knmi.nl/open-data}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-0}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=skydive-proxy
      - traefik.http.routers.skydive.rule=Host(`${TRAEFIK_HOST:-skydive-theorie.localhost}`)
      - traefik.http.routers.skydive.entrypoints=websecure
      - traefik.http.routers.skydive.tls=true
      - traefik.http.services.skydive.loadbalancer.server.port=5000
      - traefik.http.services.skydive.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.skydive.loadbalancer.healthcheck.interval=10s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.6.2
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skydive-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --accesslog.format=json
      - --accesslog.fields.headers.names.User-Agent=keep
      - --accesslog.fields.headers.names.Referer=keep
    ports:
      - "${TRAEFIK_HTTP_PORT:-8080}:80"
      - "${TRAEFIK_HTTPS_PORT:-8443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik-logs:/logs
    networks:
      - proxy

  logrotate:
    build:
      context: ./logrotate
    restart: unless-stopped
    volumes:
      - traefik-logs:/logs

networks:
  proxy:
    name: skydive-proxy

volumes:
  app-data:
  letsencrypt:
  traefik-logs: