services:
  app:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./vragen.db:/data/vragen.db
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=skydive-proxy
      - traefik.http.routers.skydive.rule=Host(`${TRAEFIK_HOST:-skydive-theorie.localhost}`)
      - traefik.http.routers.skydive.entrypoints=websecure
      - traefik.http.routers.skydive.tls=true
      - traefik.http.routers.skydive.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-}
      - traefik.http.services.skydive.loadbalancer.server.port=5000
      - traefik.http.services.skydive.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.skydive.loadbalancer.healthcheck.interval=10s

  traefik:
    image: traefik:v3.6.2
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skydive-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:-}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    name: skydive-proxy

volumes:
  letsencrypt: