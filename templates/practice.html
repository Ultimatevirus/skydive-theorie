<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <title>Oefenexamen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">Skydive-theorie.nl</div>
            <nav class="main-nav">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('practice') }}">Oefenexamen</a>
                <a href="{{ url_for('learn') }}">Leren voor het examen</a>
                <a href="{{ url_for('contact') }}">Contact</a>
                <button class="theme-toggle" type="button" aria-label="Wissel tussen licht en donker thema">
                    <span class="theme-icon" aria-hidden="true">💡</span>
                </button>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        <div class="container">
            <div class="card exam-card practice-card">
                <p class="eyebrow">Oefenexamen</p>
                <h1>{{ question_text }}</h1>

                {% if error %}
                    <div class="error-box">{{ error }}</div>
                {% endif %}

                {% if stage == 'level' %}
                    <div class="choice-grid" aria-label="Kies een brevet">
                        <form method="POST" action="{{ url_for('practice_select') }}" class="choice-form">
                            <button type="submit" name="level" value="A" class="choice-card option-card">
                                <span class="choice-label">A</span>
                            </button>
                        </form>
                        <form method="POST" action="{{ url_for('practice_select') }}" class="choice-form">
                            <button type="submit" name="level" value="B" class="choice-card option-card">
                                <span class="choice-label">B</span>
                            </button>
                        </form>
                    </div>
                {% elif stage == 'mode' %}
                    <div class="choice-grid" aria-label="Kies oefenmodus">
                        <form method="POST" action="{{ url_for('practice_mode', level=level) }}" class="choice-form">
                            <button type="submit" name="practice_type" value="exam" class="choice-card option-card">
                                <span class="choice-label">Oefenexamen maken</span>
                            </button>
                        </form>
                        <form method="POST" action="{{ url_for('practice_mode', level=level) }}" class="choice-form">
                            <button type="submit" name="practice_type" value="free" class="choice-card option-card">
                                <span class="choice-label">Vrij oefenen</span>
                            </button>
                        </form>
                    </div>
                {% elif stage == 'free' %}
                    <form method="POST" action="{{ url_for('practice_free', level=level) }}" class="start-form">
                        <div class="field-group">
                            <label for="question_amount">Hoeveel vragen wil je laden?</label>
                            <input
                                id="question_amount"
                                name="question_amount"
                                type="number"
                                min="1"
                                max="40"
                                value="10"
                                required
                            >
                        </div>

                        <div class="button-row">
                            <button type="submit" class="primary-btn">Start oefenen</button>
                            <a href="{{ url_for('practice_mode', level=level) }}" class="secondary-btn">Terug</a>
                        </div>
                    </form>
                {% endif %}

                <div class="button-row practice-footer">
                    <a href="{{ url_for('index') }}" class="secondary-btn">Terug naar home</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>gemaakt door Alex Brittmann</span>
        </div>
    </footer>

    <script>
        const root = document.documentElement;
        const themeToggle = document.querySelector('.theme-toggle');
        const themeIcon = document.querySelector('.theme-icon');

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            root.setAttribute('data-theme', isDark ? 'dark' : 'light');
            if (themeIcon) {
                themeIcon.textContent = isDark ? '🔆' : '💡';
            }
            if (themeToggle) {
                themeToggle.setAttribute('aria-label', isDark ? 'Schakel naar licht thema' : 'Schakel naar donker thema');
            }
        }

        const savedTheme = localStorage.getItem('theme-preference');
        const preferredTheme = savedTheme || 'light';
        applyTheme(preferredTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme-preference', nextTheme);
                applyTheme(nextTheme);
            });
        }
    </script>
</body>
</html>
