<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('favicon') }}?v=2">
    <link rel="shortcut icon" type="image/svg+xml" href="{{ url_for('favicon') }}?v=2">
    <title>Oefenexamen</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">Skydive-theorie.nl</div>
            <nav class="main-nav">
                <a href="{{ url_for('index') }}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l-2 0l9 -9l9 9l-2 0"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-7"/><path d="M9 21v-6a2 2 0 0 1 2 -2h2a2 2 0 0 1 2 2v6"/></svg>
                    <span>Home</span>
                </a>
                <a href="{{ url_for('practice') }}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -14"/><path d="M9 7l6 0"/><path d="M9 11l6 0"/><path d="M9 15l4 0"/></svg>
                    <span>Oefenexamen</span>
                </a>
                <a href="{{ url_for('learn') }}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 19a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6a9 9 0 0 1 9 0a9 9 0 0 1 9 0"/><path d="M3 6l0 13"/><path d="M12 6l0 13"/><path d="M21 6l0 13"/></svg>
                    <span>Leren voor het examen</span>
                </a>
                <a href="{{ url_for('contact') }}" class="nav-link">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10"/><path d="M3 7l9 6l9 -6"/></svg>
                    <span>Contact</span>
                </a>
                <button class="theme-toggle" type="button" aria-label="Wissel tussen licht en donker thema">
                    <svg class="theme-icon is-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7"/>
                        <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3"/>
                        <path d="M9.7 17h4.6"/>
                    </svg>
                    <svg class="theme-icon is-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7"/>
                        <path d="M11.089 7.083a5 5 0 0 1 5.826 5.84m-1.378 2.611a5.012 5.012 0 0 1 -.537 .466a3.5 3.5 0 0 0 -1 3a2 2 0 1 1 -4 0a3.5 3.5 0 0 0 -1 -3a5 5 0 0 1 -.528 -7.544"/>
                        <path d="M9.7 17h4.6"/>
                        <path d="M3 3l18 18"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="page-shell">
        <div class="container">
            <div class="card exam-card practice-card">
                <div class="page-header">
                    <div>
                        <p class="eyebrow">Oefenexamen</p>
                        <h1>{{ question_text }}</h1>
                    </div>
                </div>

                {% if error %}
                    <div class="error-box">{{ error }}</div>
                {% endif %}

                {% if stage == 'level' %}
                    <div class="choice-grid" aria-label="Kies een brevet">
                        <form method="POST" action="{{ url_for('practice_select') }}" class="choice-form">
                            <button type="submit" name="level" value="A" class="choice-card option-card">
                                <span class="choice-label">A</span>
                            </button>
                        </form>
                        <form method="POST" action="{{ url_for('practice_select') }}" class="choice-form">
                            <button type="submit" name="level" value="B" class="choice-card option-card">
                                <span class="choice-label">B</span>
                            </button>
                        </form>
                    </div>
                {% elif stage == 'mode' %}
                    <div class="choice-grid" aria-label="Kies oefenmodus">
                        <form method="POST" action="{{ url_for('practice_mode', level=level) }}" class="choice-form">
                            <button type="submit" name="practice_type" value="exam" class="choice-card option-card">
                                <span class="choice-label">Oefenexamen maken</span>
                            </button>
                        </form>
                        <form method="POST" action="{{ url_for('practice_mode', level=level) }}" class="choice-form">
                            <button type="submit" name="practice_type" value="free" class="choice-card option-card">
                                <span class="choice-label">Vrij oefenen</span>
                            </button>
                        </form>
                    </div>
                {% elif stage == 'free' %}
                    <form method="POST" action="{{ url_for('practice_free', level=level) }}" class="start-form">
                        <div class="field-group">
                            <label for="question_amount">Hoeveel vragen wil je laden?</label>
                            <input
                                id="question_amount"
                                name="question_amount"
                                type="number"
                                min="1"
                                max="40"
                                value="10"
                                required
                            >
                        </div>

                        <div class="button-row">
                            <button type="submit" class="primary-btn">Start oefenen</button>
                            <a href="{{ url_for('practice_mode', level=level) }}" class="secondary-btn">Terug</a>
                        </div>
                    </form>
                {% endif %}

                <div class="button-row practice-footer">
                    <a href="{{ url_for('index') }}" class="secondary-btn">Terug naar home</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span>gemaakt door Alex Brittmann</span>
        </div>
    </footer>

    <script>
        const root = document.documentElement;
        const themeToggle = document.querySelector('.theme-toggle');

        function makeThemeButtonMarkup() {
            return `
                <svg class="theme-icon is-light" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7"/>
                    <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3"/>
                    <path d="M9.7 17h4.6"/>
                </svg>
                <svg class="theme-icon is-dark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7"/>
                    <path d="M11.089 7.083a5 5 0 0 1 5.826 5.84m-1.378 2.611a5.012 5.012 0 0 1 -.537 .466a3.5 3.5 0 0 0 -1 3a2 2 0 1 1 -4 0a3.5 3.5 0 0 0 -1 -3a5 5 0 0 1 -.528 -7.544"/>
                    <path d="M9.7 17h4.6"/>
                    <path d="M3 3l18 18"/>
                </svg>
            `;
        }

        function ensureThemeIcon() {
            if (!themeToggle) return;
            const hasSvg = themeToggle.querySelector('svg');
            if (!hasSvg || themeToggle.textContent.includes('💡')) {
                themeToggle.innerHTML = makeThemeButtonMarkup();
            }
        }

        function applyTheme(theme) {
            const isDark = theme === 'dark';
            root.setAttribute('data-theme', isDark ? 'dark' : 'light');
            if (themeToggle) {
                themeToggle.setAttribute('aria-label', isDark ? 'Schakel naar licht thema' : 'Schakel naar donker thema');
            }
        }

        ensureThemeIcon();

        const savedTheme = localStorage.getItem('theme-preference');
        const preferredTheme = savedTheme || 'light';
        applyTheme(preferredTheme);

        if (themeToggle) {
            themeToggle.addEventListener('click', () => {
                const currentTheme = root.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
                const nextTheme = currentTheme === 'dark' ? 'light' : 'dark';
                localStorage.setItem('theme-preference', nextTheme);
                applyTheme(nextTheme);
            });
        }
    </script>
</body>
</html>
