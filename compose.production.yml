services:
  app:
    build:
      context: .
    restart: unless-stopped
    # Two replicas so one stalled or restarting container never takes the site offline.
    deploy:
      replicas: 2
    expose:
      - "5000"
    volumes:
      - app-data:/data
    environment:
      APP_ENV: production
      # 2 replicas x 2 workers = 4 worker processes, one per core.
      GUNICORN_PROCESSES: ${GUNICORN_PROCESSES:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-6}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ACCESS_GATE_ENABLED: ${ACCESS_GATE_ENABLED:-1}
      ACCESS_CODE: ${ACCESS_CODE:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      KNMI_API_KEY: ${KNMI_API_KEY:-}
      KNMI_NOTIFICATION_API_KEY: ${KNMI_NOTIFICATION_API_KEY:-}
      KNMI_OPEN_DATA_URL: ${KNMI_OPEN_DATA_URL:-https://api.dataplatform.knmi.nl/open-data}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-0}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=skydive-proxy
      - traefik.http.routers.skydive.rule=Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`)
      - traefik.http.routers.skydive.entrypoints=websecure
      - traefik.http.routers.skydive.tls=true
      - traefik.http.routers.skydive.tls.certresolver=letsencrypt
      - traefik.http.services.skydive.loadbalancer.server.port=5000
      - traefik.http.services.skydive.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.skydive.loadbalancer.healthcheck.interval=15s
      - traefik.http.services.skydive.loadbalancer.healthcheck.timeout=15s
      - traefik.http.middlewares.skydive-compress.compress=true
      - traefik.http.middlewares.skydive-app-limit.ratelimit.average=${APP_RATE_LIMIT_AVERAGE:-300}
      - traefik.http.middlewares.skydive-app-limit.ratelimit.period=1m
      - traefik.http.middlewares.skydive-app-limit.ratelimit.burst=${APP_RATE_LIMIT_BURST:-100}
      - traefik.http.middlewares.skydive-app-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.routers.skydive.middlewares=skydive-app-limit,skydive-compress
      # Redirect the bare/apex domain to the canonical TRAEFIK_HOST (e.g. apex -> www)
      - traefik.http.middlewares.skydive-www-redirect.redirectregex.regex=^https?://${TRAEFIK_APEX_HOST:?TRAEFIK_APEX_HOST must be set}/(.*)
      - traefik.http.middlewares.skydive-www-redirect.redirectregex.replacement=https://${TRAEFIK_HOST:?TRAEFIK_HOST must be set}/$${1}
      - traefik.http.middlewares.skydive-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.skydive-apex.rule=Host(`${TRAEFIK_APEX_HOST:?TRAEFIK_APEX_HOST must be set}`)
      - traefik.http.routers.skydive-apex.entrypoints=websecure
      - traefik.http.routers.skydive-apex.tls=true
      - traefik.http.routers.skydive-apex.tls.certresolver=letsencrypt
      - traefik.http.middlewares.skydive-apex-limit.ratelimit.average=${APEX_RATE_LIMIT_AVERAGE:-300}
      - traefik.http.middlewares.skydive-apex-limit.ratelimit.period=1m
      - traefik.http.middlewares.skydive-apex-limit.ratelimit.burst=${APEX_RATE_LIMIT_BURST:-100}
      - traefik.http.middlewares.skydive-apex-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.routers.skydive-apex.middlewares=skydive-apex-limit,skydive-www-redirect
      - traefik.http.routers.skydive-apex.service=skydive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=12)"]
      interval: 20s
      timeout: 15s
      retries: 5
      start_period: 20s

  static:
    build:
      context: .
      dockerfile: nginx-static/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=skydive-proxy
      - traefik.http.routers.skydive-static.rule=Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`) && PathPrefix(`/static/`)
      - traefik.http.routers.skydive-static.priority=100
      - traefik.http.routers.skydive-static.entrypoints=websecure
      - traefik.http.routers.skydive-static.tls=true
      - traefik.http.routers.skydive-static.tls.certresolver=letsencrypt
      - traefik.http.routers.skydive-static.service=skydive-static
      - traefik.http.services.skydive-static.loadbalancer.server.port=80
      - traefik.http.middlewares.skydive-static-limit.ratelimit.average=${STATIC_RATE_LIMIT_AVERAGE:-1200}
      - traefik.http.middlewares.skydive-static-limit.ratelimit.period=1m
      - traefik.http.middlewares.skydive-static-limit.ratelimit.burst=${STATIC_RATE_LIMIT_BURST:-200}
      - traefik.http.middlewares.skydive-static-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
      - traefik.http.routers.skydive-static.middlewares=skydive-static-limit
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  proxy:
    # Created and owned by compose.infra.yml
    name: skydive-proxy
    external: true

volumes:
  app-data:
