services:
  app:
    build:
      context: .
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ACCESS_GATE_ENABLED: ${ACCESS_GATE_ENABLED:-1}
      ACCESS_CODE: ${ACCESS_CODE:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      KNMI_API_KEY: ${KNMI_API_KEY:-}
      KNMI_OPEN_DATA_URL: ${KNMI_OPEN_DATA_URL:-https://api.dataplatform.knmi.nl/open-data}
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=skydive-proxy
      - traefik.http.routers.skydive.rule=Host(`${TRAEFIK_HOST:?TRAEFIK_HOST must be set}`)
      - traefik.http.routers.skydive.entrypoints=websecure
      - traefik.http.routers.skydive.tls=true
      - traefik.http.routers.skydive.tls.certresolver=letsencrypt
      - traefik.http.services.skydive.loadbalancer.server.port=5000
      - traefik.http.services.skydive.loadbalancer.healthcheck.path=/healthz
      - traefik.http.services.skydive.loadbalancer.healthcheck.interval=10s
      # Redirect the bare/apex domain to the canonical TRAEFIK_HOST (e.g. apex -> www)
      - traefik.http.middlewares.skydive-www-redirect.redirectregex.regex=^https?://${TRAEFIK_APEX_HOST:?TRAEFIK_APEX_HOST must be set}/(.*)
      - traefik.http.middlewares.skydive-www-redirect.redirectregex.replacement=https://${TRAEFIK_HOST:?TRAEFIK_HOST must be set}/$${1}
      - traefik.http.middlewares.skydive-www-redirect.redirectregex.permanent=true
      - traefik.http.routers.skydive-apex.rule=Host(`${TRAEFIK_APEX_HOST:?TRAEFIK_APEX_HOST must be set}`)
      - traefik.http.routers.skydive-apex.entrypoints=websecure
      - traefik.http.routers.skydive-apex.tls=true
      - traefik.http.routers.skydive-apex.tls.certresolver=letsencrypt
      - traefik.http.routers.skydive-apex.middlewares=skydive-www-redirect
      - traefik.http.routers.skydive-apex.service=skydive
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3

  traefik:
    image: traefik:v3.6.2
    restart: unless-stopped
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=skydive-proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --accesslog=true
      - --accesslog.filepath=/logs/access.log
      - --accesslog.format=json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
      - traefik-logs:/logs
    networks:
      - proxy

  logrotate:
    build:
      context: ./logrotate
    restart: unless-stopped
    volumes:
      - traefik-logs:/logs

networks:
  proxy:
    name: skydive-proxy

volumes:
  letsencrypt:
  traefik-logs:
