services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set to an immutable image tag or digest}
    build: !reset null
    environment:
      APP_ENV: production
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-1}
      CONTACT_RECIPIENT_EMAIL: ${CONTACT_RECIPIENT_EMAIL:-}
      CONTACT_SENDER_EMAIL: ${CONTACT_SENDER_EMAIL:-}
    labels:
      - traefik.http.routers.skydive.tls.certresolver=letsencrypt

  traefik:
    ports: !override
      - "80:80"
      - "443:443"